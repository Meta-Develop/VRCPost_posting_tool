name: Public Repository CI

"on":
  push: {}
  pull_request: {}
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: >-
    public-ci-${{ github.workflow }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_ONLY_BINARY: ":all:"

jobs:
  python-static:
    name: Static ${{ matrix.logic-unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Issue #9 tracks Black conformance for browser, GUI, and utility sources.
        # Compile and Ruff checks remain enabled for every listed logic unit.
        include:
          - logic-unit: entrypoint
            python-version: "3.12.12"
            check_format: true
          - logic-unit: browser
            python-version: "3.12.12"
            check_format: false
          - logic-unit: scheduler
            python-version: "3.12.12"
            check_format: true
          - logic-unit: gui
            python-version: "3.12.12"
            check_format: false
          - logic-unit: config
            python-version: "3.12.12"
            check_format: true
          - logic-unit: utils
            python-version: "3.12.12"
            check_format: false
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python and install pinned static tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.12"
          python -m pip install --no-deps \
            black==26.5.1 \
            click==8.4.2 \
            mypy-extensions==1.1.0 \
            packaging==26.2 \
            pathspec==1.1.1 \
            platformdirs==4.11.0 \
            pytokens==0.4.1 \
            ruff==0.16.0
          python -m pip check

      - name: Compile, lint, and check supported formatting
        shell: bash
        env:
          CHECK_FORMAT: ${{ matrix.check_format }}
          LOGIC_UNIT: ${{ matrix.logic-unit }}
        run: |
          set -euo pipefail

          case "$LOGIC_UNIT" in
            entrypoint)
              paths=(src/__init__.py src/__main__.py)
              ;;
            browser)
              paths=(src/browser)
              ;;
            scheduler)
              paths=(src/scheduler)
              ;;
            gui)
              paths=(src/gui)
              ;;
            config)
              paths=(src/config)
              ;;
            utils)
              paths=(src/utils)
              ;;
            *)
              echo "::error::Unknown CI logic unit: $LOGIC_UNIT"
              exit 1
              ;;
          esac

          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache-${LOGIC_UNIT}" \
            python -m compileall -q "${paths[@]}"
          ruff check "${paths[@]}"
          if [[ "$CHECK_FORMAT" == "true" ]]; then
            black --check --target-version py310 "${paths[@]}"
          fi

  local-playwright-e2e:
    name: Local Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"

      - name: Verify local-only test targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          expected_url = "http://localhost:5000"
          test_files = (
              Path("tests/test_e2e.py"),
              Path("tests/test_e2e_managers.py"),
          )

          for path in test_files:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              values = {}
              for node in tree.body:
                  if (
                      isinstance(node, ast.Assign)
                      and len(node.targets) == 1
                      and isinstance(node.targets[0], ast.Name)
                      and isinstance(node.value, ast.Constant)
                  ):
                      values[node.targets[0].id] = node.value.value
              if values.get("BASE_URL") != expected_url:
                  raise SystemExit(f"{path}: BASE_URL must be {expected_url}")

          settings = json.loads(Path("config/settings.json").read_text(encoding="utf-8"))
          if settings.get("test_mode") is not True:
              raise SystemExit("config/settings.json must keep test_mode enabled")
          parsed = urlparse(settings.get("test_server_url", ""))
          if parsed.scheme != "http" or parsed.hostname not in {"localhost", "127.0.0.1"}:
              raise SystemExit("The configured test server must use local HTTP")
          PY

      - name: Install pinned E2E dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.12"
          python -m pip install --no-deps \
            annotated-types==0.8.0 \
            blinker==1.9.0 \
            click==8.4.2 \
            flask==3.1.3 \
            greenlet==3.5.4 \
            iniconfig==2.3.0 \
            itsdangerous==2.2.0 \
            jinja2==3.1.6 \
            loguru==0.7.3 \
            markupsafe==3.0.3 \
            packaging==26.2 \
            pillow==12.3.0 \
            playwright==1.61.0 \
            pluggy==1.6.0 \
            pydantic==2.13.4 \
            pydantic-core==2.46.4 \
            pydantic-settings==2.14.2 \
            pyee==13.0.1 \
            pygments==2.20.0 \
            pytest==9.1.1 \
            pytest-asyncio==1.4.0 \
            python-dotenv==1.2.2 \
            typing-extensions==4.16.0 \
            typing-inspection==0.4.2 \
            werkzeug==3.1.8
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Start the loopback test server
        shell: bash
        run: |
          set -euo pipefail
          python -c \
            'from tests.test_server.app import run_server; run_server(host="127.0.0.1", port=5000, debug=False)' \
            >"${RUNNER_TEMP}/vrcpost-test-server.log" 2>&1 &
          echo "TEST_SERVER_PID=$!" >> "$GITHUB_ENV"

          python - <<'PY'
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:5000/home"
          for _ in range(60):
              try:
                  with urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit(f"Local test server did not become ready: {url}")
          PY

      - name: Run local Playwright E2E tests
        shell: bash
        env:
          BASE_URL: "http://127.0.0.1:9"
          TEST_MODE: "true"
          TEST_SERVER_URL: "http://127.0.0.1:5000"
        run: |
          set -euo pipefail
          python -m pytest -v tests/test_e2e.py tests/test_e2e_managers.py

      - name: Stop the loopback test server
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TEST_SERVER_PID:-}" ]]; then
            kill "$TEST_SERVER_PID" 2>/dev/null || true
          fi
